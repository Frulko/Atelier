# Atelier — pile de PRODUCTION à partir d'images publiées (aucune construction sur le serveur).
#   • Portainer : Stacks → Add stack → Web editor (colle ce fichier) ou Repository (ce dépôt, ce fichier), puis les variables de .env.example.
#   • Docker seul : cp .env.example .env && docker compose -f docker-compose.prod.yml up -d
# Images par défaut : celles du dépôt (ghcr.io/frulko/atelier). Pour utiliser les vôtres : ATELIER_IMAGE et ATELIER_SANDBOX_IMAGE
# (construire et publier : scripts/release.sh, voir docs/deployment.md). Épinglez une version (:1.0.0) plutôt que :latest en production.
name: atelier

services:
  # Tire l'image du bac à sable sur l'hôte (c'est le démon de l'hôte qui la lance ensuite à chaque tâche), puis s'arrête : c'est normal.
  sandbox-image:
    image: ${ATELIER_SANDBOX_IMAGE:-ghcr.io/frulko/atelier-sandbox:latest}
    entrypoint: ["true"]
    restart: "no"

  orchestrator:
    image: ${ATELIER_IMAGE:-ghcr.io/frulko/atelier:latest}
    container_name: ${ATELIER_CONTAINER:-atelier-orchestrator}   # nom DNS vu par les bacs à sable (proxy des modèles)
    restart: unless-stopped
    depends_on:
      sandbox-image: { condition: service_completed_successfully }
    environment:
      ATELIER_PASSWORD: ${ATELIER_PASSWORD:?mot de passe initial du compte propriétaire}
      ATELIER_BOOTSTRAP_EMAIL: ${ATELIER_BOOTSTRAP_EMAIL:-admin@localhost}
      TRUST_PROXY: ${TRUST_PROXY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      ATELIER_MASTER_KEY: ${ATELIER_MASTER_KEY:-}
      ATELIER_GIT_HOSTS: ${ATELIER_GIT_HOSTS:-}
      ATELIER_HEALTH_ALLOW_PRIVATE: ${ATELIER_HEALTH_ALLOW_PRIVATE:-}
      # Clés et projets lus UNE fois, au premier démarrage, pour peupler l'organisation par défaut (ensuite : l'interface).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GIT_TOKEN: ${GIT_TOKEN:-}
      PROJECTS_JSON: ${PROJECTS_JSON:-}
      MAX_BUDGET_USD: ${MAX_BUDGET_USD:-2}
      SANDBOX_IMAGE: ${ATELIER_SANDBOX_IMAGE:-ghcr.io/frulko/atelier-sandbox:latest}
      SANDBOX_NETWORK: ${ATELIER_SANDBOX_NET:-atelier-sandbox}
      PROXY_URL: http://${ATELIER_CONTAINER:-atelier-orchestrator}:8081
      ATELIER_WORKDIR: ${ATELIER_WORKDIR:-/srv/atelier/work}
    volumes:
      # ⚠ Le socket Docker donne les droits root de l'hôte : machine dédiée, équipe de confiance (docs/security.md).
      - /var/run/docker.sock:/var/run/docker.sock
      # Même chemin des deux côtés : c'est le démon de l'hôte qui monte ce dossier dans les bacs à sable.
      - ${ATELIER_WORKDIR:-/srv/atelier/work}:${ATELIER_WORKDIR:-/srv/atelier/work}
      - data:/data
    ports:
      - "${ATELIER_PORT:-8080}:8080"
    networks: [default, sandbox]

volumes:
  data:

networks:
  # Réseau SANS Internet : les bacs à sable n'y joignent que le proxy de l'orchestrateur.
  sandbox:
    name: ${ATELIER_SANDBOX_NET:-atelier-sandbox}
    internal: true
