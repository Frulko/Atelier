<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --mut:#78716c; --card:#fff; --line:#e7e5e4; --acc:#ea580c; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#fafaf9; --mut:#a8a29e; --card:#292524; --line:#44403c; } }
  * { box-sizing: border-box }
  [hidden] { display:none !important } /* sinon un display:grid écrase l'attribut hidden */
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg) }
  main { max-width:900px; margin:0 auto; padding:24px 16px; display:grid; gap:16px }
  h1 { margin:0; font-size:20px } h1 small { color:var(--mut); font-weight:400 }
  h2 { margin:0 0 8px; font-size:15px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px }
  select,textarea,button,input { font:inherit; color:inherit; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--bg) }
  textarea,input:not([type=checkbox]) { width:100% }
  textarea { min-height:90px; resize:vertical }
  button { cursor:pointer } button.primary { background:var(--acc); border-color:var(--acc); color:#fff }
  button:disabled { opacity:.45; cursor:not-allowed } button.armed { border-color:#dc2626; color:#dc2626 }
  .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center }
  .grid { display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)) }
  .tasks button { display:block; width:100%; text-align:left; margin-top:6px }
  .tasks button.on { border-color:var(--acc) }
  .st { font-size:12px; color:var(--mut) }
  .err { color:#dc2626; min-height:1.4em; font-size:13px }
  .ok { color:#16a34a; font-size:13px }
  header.top { display:flex; align-items:center; gap:10px; flex-wrap:wrap }
  header.top h1 { flex:1 }
  nav.tabs { display:flex; gap:6px } nav.tabs button.on { border-color:var(--acc); color:var(--acc) }
  #login, #invite { max-width:380px; margin:12vh auto 0; display:grid; gap:10px }
  #acct, #neworg form { display:grid; gap:8px; margin-top:8px }
  table { width:100%; border-collapse:collapse; font-size:14px }
  td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:middle }
  td select, td button { padding:4px 8px } td.act { text-align:right; white-space:nowrap }
  code { font:12.5px ui-monospace,monospace; word-break:break-all }
  #log { font:13px/1.5 ui-monospace,monospace; max-height:50vh; overflow:auto; white-space:pre-wrap }
  .e-step { color:var(--acc) } .e-error,.e-check_failed { color:#dc2626 } .e-tool { color:var(--mut) } .e-done { color:#16a34a; font-weight:600 }
  .scroll { overflow-x:auto }
</style>

<main id="login" hidden>
  <h1>Atelier</h1>
  <form class="card" id="lf" style="display:grid;gap:10px">
    <div class="st" id="lnote"></div>
    <input id="email" type="email" placeholder="E-mail" autocomplete="username" required>
    <input id="pass" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
    <div class="err" id="lerr" role="alert"></div>
    <button class="primary">Se connecter</button>
  </form>
</main>

<main id="invite" hidden>
  <h1>Atelier</h1>
  <form class="card" id="inf" style="display:grid;gap:10px">
    <strong>Tu as été invité(e) à rejoindre une organisation.</strong>
    <div class="st" id="innote"></div>
    <input id="inpass" type="password" placeholder="Choisis un mot de passe (8 caractères min.)" autocomplete="new-password">
    <div class="err" id="inerr" role="alert"></div>
    <button class="primary" id="inbtn">Créer mon compte et rejoindre</button>
    <button type="button" id="inlogin">J'ai déjà un compte : me connecter</button>
  </form>
</main>

<main id="app" hidden>
  <header class="top">
    <h1>Atelier <small>— demande une modification, l'agent prépare une proposition à valider</small></h1>
    <select id="org" aria-label="Organisation" hidden></select>
    <span class="st" id="who"></span>
    <button id="logout" type="button">Déconnexion</button>
  </header>
  <nav class="tabs">
    <button type="button" id="tab-tasks" class="on">Tâches</button>
    <button type="button" id="tab-settings" hidden>Réglages</button>
  </nav>

  <section id="v-tasks" style="display:grid;gap:16px">
    <form class="card" id="f">
      <select id="project" aria-label="Projet"></select>
      <textarea id="prompt" placeholder="Ex. : ajoute un tarif dégressif sur l'onglet Voyage" required></textarea>
      <div class="err" id="ferr" role="alert"></div>
      <div class="row"><button class="primary">Envoyer</button></div>
    </form>
    <div class="card tasks"><strong>Tâches</strong><div id="tasks"></div></div>
    <div class="card" id="detail" hidden>
      <div class="row" style="margin:0 0 8px"><strong id="title"></strong><button id="cancel" type="button">Annuler</button></div>
      <div id="log"></div>
    </div>
  </section>

  <section id="v-settings" style="display:grid;gap:16px" hidden></section>

  <details class="card"><summary>Mon compte</summary>
    <form id="acct">
      <div class="st">Changer le mot de passe (les autres appareils seront déconnectés)</div>
      <input id="cur" type="password" placeholder="Mot de passe actuel" autocomplete="current-password" required>
      <input id="nxt" type="password" placeholder="Nouveau mot de passe (8 caractères min.)" autocomplete="new-password" required>
      <div class="err" id="aerr" role="alert"></div>
      <button>Changer</button>
    </form>
  </details>
  <details class="card" id="neworg"><summary>Nouvelle organisation</summary>
    <form>
      <input id="orgname" placeholder="Nom de l'organisation" maxlength="80" required>
      <div class="err" id="oerr" role="alert"></div>
      <button>Créer (tu en seras le propriétaire)</button>
    </form>
  </details>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const LABEL = { queued:"en attente", running:"en cours", done:"prête à valider", no_changes:"rien à changer", failed:"échec", cancelled:"annulée" };
const RANK = { viewer:0, member:1, admin:2, owner:3 };
const ROLE_FR = { viewer:"lecteur", member:"membre", admin:"administrateur", owner:"propriétaire" };
const PROVIDERS = ["anthropic", "openai", "openrouter"];
// Mêmes règles que le serveur (access.ts) ; elles ne servent qu'à griser les boutons, le serveur décide.
const canAssign = (me, r) => RANK[me] >= RANK.admin && RANK[me] >= RANK[r];
const canTouch = (me, r) => RANK[me] >= RANK.admin && (r !== "owner" || me === "owner");

let ORG, ME, ROLE, es, cur, timer;
let INVITE = new URLSearchParams(location.search).get("invite");
const orgUrl = (p) => `/api/orgs/${ORG}${p}`;
const isAdmin = () => RANK[ROLE] >= RANK.admin;

async function api(path, opt = {}) {
  const r = await fetch(path, opt);
  if (!r.ok) {
    const e = new Error((await r.json().catch(() => ({}))).error || r.status);
    e.status = r.status;
    throw e;
  }
  return r.json();
}
const send = (path, body, method = "POST") => api(path, { method, headers: { "content-type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });

function view(name) {
  for (const v of ["login", "invite", "app"]) $("#" + v).hidden = v !== name;
  if (name !== "app") { clearInterval(timer); es?.close(); }
}
function tab(name) {
  $("#v-tasks").hidden = name !== "tasks";
  $("#v-settings").hidden = name !== "settings";
  $("#tab-tasks").classList.toggle("on", name === "tasks");
  $("#tab-settings").classList.toggle("on", name === "settings");
  if (name === "settings") loadSettings();
}

/* ------------------------------- connexion / invitation ------------------------------- */

async function boot() {
  let me = null;
  try { me = await api("/api/me"); } catch (e) { if (e.status !== 401) console.error(e); }
  if (INVITE) return showInvite(me);
  if (!me) { $("#lnote").textContent = ""; return view("login"); }
  showApp(me);
}

function showInvite(me) {
  view("invite"); $("#inerr").textContent = "";
  const connected = !!me;
  $("#inpass").hidden = connected; $("#inlogin").hidden = connected;
  $("#inbtn").textContent = connected ? `Rejoindre avec ${me.user.email}` : "Créer mon compte et rejoindre";
  $("#innote").textContent = connected ? "Tu es connecté(e) : l'invitation doit avoir été faite pour cette adresse." : "L'adresse e-mail est celle de l'invitation.";
  $("#inpass").required = !connected;
}
$("#inf").onsubmit = async (ev) => {
  ev.preventDefault(); $("#inerr").textContent = "";
  try {
    const connected = $("#inpass").hidden;
    await send("/api/auth/accept-invite", connected ? { token: INVITE } : { token: INVITE, password: $("#inpass").value });
    $("#inpass").value = ""; INVITE = null; history.replaceState(null, "", location.pathname);
    await boot();
  } catch (e) {
    $("#inerr").textContent = e.message;
    if (e.status === 409) $("#inlogin").hidden = false; // un compte existe : il faut se connecter d'abord
  }
};
$("#inlogin").onclick = () => { $("#lnote").textContent = "Connecte-toi avec l'adresse invitée : l'invitation te sera ensuite proposée."; view("login"); };

$("#lf").onsubmit = async (ev) => {
  ev.preventDefault(); $("#lerr").textContent = "";
  try {
    await send("/api/auth/login", { email: $("#email").value, password: $("#pass").value });
    $("#pass").value = ""; await boot();
  } catch (e) { $("#lerr").textContent = e.message; }
};
$("#logout").onclick = async () => { await send("/api/auth/logout").catch(() => {}); ME = ROLE = ORG = undefined; view("login"); };

/* ----------------------------------- application ----------------------------------- */

async function showApp(me) {
  ME = me; view("app");
  const orgs = me.orgs;
  ORG = orgs.find((o) => o.id === localStorage.getItem("org"))?.id ?? orgs[0]?.id;
  ROLE = orgs.find((o) => o.id === ORG)?.role;
  $("#org").innerHTML = orgs.map((o) => `<option value="${esc(o.id)}"${o.id === ORG ? " selected" : ""}>${esc(o.name)} (${esc(ROLE_FR[o.role])})</option>`).join("");
  $("#org").hidden = orgs.length < 2;
  $("#who").textContent = me.user.email + (orgs.length === 1 ? ` · ${orgs[0].name} (${ROLE_FR[orgs[0].role]})` : "");
  $("#tab-settings").hidden = !ORG || !isAdmin();
  if (!ORG) { $("#who").textContent += " — aucune organisation"; $("#v-tasks").hidden = true; return; }
  tab("tasks");
  await loadProjects(); await loadTasks();
  clearInterval(timer); timer = setInterval(loadTasks, 5000);
}
$("#org").onchange = () => { localStorage.setItem("org", $("#org").value); es?.close(); $("#detail").hidden = true; cur = null; boot(); };
$("#tab-tasks").onclick = () => tab("tasks");
$("#tab-settings").onclick = () => tab("settings");

$("#neworg form").onsubmit = async (ev) => {
  ev.preventDefault(); $("#oerr").textContent = "";
  try {
    const o = await send("/api/orgs", { name: $("#orgname").value });
    localStorage.setItem("org", o.id); $("#orgname").value = ""; $("#neworg").open = false; await boot();
  } catch (e) { $("#oerr").textContent = e.message; }
};
$("#acct").onsubmit = async (ev) => {
  ev.preventDefault(); $("#aerr").textContent = "";
  try {
    await send("/api/auth/password", { current: $("#cur").value, next: $("#nxt").value });
    $("#cur").value = $("#nxt").value = ""; $("#aerr").className = "ok"; $("#aerr").textContent = "Mot de passe changé (les autres appareils sont déconnectés).";
  } catch (e) { $("#aerr").className = "err"; $("#aerr").textContent = e.message; }
};

/* --------------------------------------- tâches --------------------------------------- */

async function loadProjects() {
  const ps = await api(orgUrl("/projects"));
  $("#project").innerHTML = ps.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("") || `<option value="">(aucun projet : un administrateur doit en créer un)</option>`;
}
async function loadTasks() {
  const ts = await api(orgUrl("/tasks")).catch((e) => { if (e.status === 401) boot(); return null; });
  if (!ts) return;
  $("#tasks").innerHTML = ts.map((t) =>
    `<button data-id="${esc(t.id)}" class="${t.id === cur ? "on" : ""}">${esc(t.prompt.slice(0, 80))}<div class="st">${esc(t.project_name ?? t.project)} · ${esc(LABEL[t.status])}${t.cost ? ` · ${t.cost.toFixed(2)} $` : ""}</div></button>`).join("") || "<p class=st>Aucune tâche.</p>";
}
function open(id, prompt) {
  cur = id; es?.close();
  $("#detail").hidden = false; $("#title").textContent = prompt; $("#log").innerHTML = "";
  es = new EventSource(orgUrl(`/tasks/${id}/events`));
  es.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.type === "status") return loadTasks();
    const log = $("#log"), line = document.createElement("div");
    line.className = "e-" + e.type;
    line.innerHTML = e.type === "done" && /^Prêt : https?:/.test(e.text) ? `Prêt : <a href="${esc(e.text.slice(7))}" target="_blank" rel="noopener">voir la proposition</a>` : esc(e.text);
    log.append(line); log.scrollTop = log.scrollHeight;
  };
  loadTasks();
}
$("#f").onsubmit = async (ev) => {
  ev.preventDefault(); $("#ferr").textContent = "";
  try {
    const t = await send(orgUrl("/tasks"), { project: $("#project").value, prompt: $("#prompt").value });
    $("#prompt").value = ""; open(t.id, t.prompt);
  } catch (e) { $("#ferr").textContent = e.message; }
};
$("#tasks").onclick = (ev) => { const b = ev.target.closest("button"); if (b) open(b.dataset.id, b.firstChild.textContent); };
$("#cancel").onclick = () => send(orgUrl(`/tasks/${cur}/cancel`)).catch(() => {});

/* -------------------------------------- réglages -------------------------------------- */

const S = $("#v-settings");
const roleOptions = (sel, allowed) => ["viewer", "member", "admin", "owner"].filter((r) => allowed(r) || r === sel)
  .map((r) => `<option value="${r}"${r === sel ? " selected" : ""}>${ROLE_FR[r]}</option>`).join("");

async function loadSettings() {
  S.dataset.ready = ""; // « prête » à la fin du rendu : sert aux tests pilotés par navigateur
  S.innerHTML = `<div class="card st">Chargement…</div>`;
  let d;
  try {
    const [org, members, invites, projects, secrets] = await Promise.all([
      api(orgUrl("")), api(orgUrl("/members")), api(orgUrl("/invitations")), api(orgUrl("/projects")), api(orgUrl("/secrets")),
    ]);
    d = { org, members, invites, projects, secrets };
  } catch (e) { S.innerHTML = `<div class="card err">${esc(e.message)}</div>`; S.dataset.ready = "1"; return; }
  const gitSecrets = d.secrets.filter((s) => s.kind === "git_token");
  const assignable = (r) => canAssign(ROLE, r);

  S.innerHTML = `
  <div class="card"><h2>Membres</h2><div class="scroll"><table>
    ${d.members.map((m) => {
      const mine = m.userId === ME.user.id, can = canTouch(ROLE, m.role);
      return `<tr><td>${esc(m.email)}${mine ? ' <span class="st">(toi)</span>' : ""}</td>
        <td><select data-act="role" data-user="${esc(m.userId)}" aria-label="Rôle de ${esc(m.email)}" ${can ? "" : "disabled"}>${roleOptions(m.role, assignable)}</select></td>
        <td class="act"><button data-act="rm-member" data-user="${esc(m.userId)}" ${can ? "" : "disabled"}>Retirer</button></td></tr>`;
    }).join("")}</table></div><div class="err" data-err="members"></div></div>

  <div class="card"><h2>Invitations</h2>
    <div class="st">Le lien n'est montré qu'une fois et rien n'est envoyé par e-mail : transmets-le toi-même.</div>
    <form data-form="invite"><div class="grid" style="margin-top:8px">
      <input name="email" type="email" placeholder="adresse e-mail" required>
      <select name="role" aria-label="Rôle">${roleOptions("member", assignable)}</select>
      <button class="primary">Créer le lien</button></div></form>
    <div data-result="invite"></div>
    <div class="err" data-err="invite"></div>
    ${d.invites.length ? `<table style="margin-top:8px">${d.invites.map((i) => `<tr><td>${esc(i.email)}</td><td>${esc(ROLE_FR[i.role])}</td>
      <td class="st">expire le ${esc(new Date(i.expires_at).toLocaleDateString("fr-FR"))}</td>
      <td class="act"><button data-act="rm-invite" data-id="${esc(i.id)}">Révoquer</button></td></tr>`).join("")}</table>` : '<p class="st">Aucune invitation en attente.</p>'}
  </div>

  <div class="card"><h2>Projets</h2><div class="scroll">${d.projects.length ? `<table>${d.projects.map((p) => `<tr>
      <td><strong>${esc(p.name)}</strong><div class="st">${esc(p.slug)} · ${esc(p.forge)} · ${esc(p.branch)}</div></td>
      <td><code>${esc(p.repo)}</code><div class="st">vérification : <code>${esc(p.check)}</code></div></td>
      <td class="act"><button data-act="rm-project" data-id="${esc(p.id)}">Supprimer</button></td></tr>`).join("")}</table>` : '<p class="st">Aucun projet.</p>'}</div>
    <form data-form="project"><div class="grid" style="margin-top:8px">
      <input name="slug" placeholder="identifiant (a-z, 0-9, -)" pattern="[a-z0-9][a-z0-9-]{0,39}" required>
      <input name="name" placeholder="nom affiché" maxlength="80" required>
      <input name="repo" placeholder="https://gitlab.exemple.fr/equipe/projet.git" required>
      <input name="branch" placeholder="branche (main)">
      <input name="check" placeholder="commande de vérification (ex. node --check app.js)">
      <input name="protectedPaths" placeholder="chemins protégés, séparés par des virgules">
      <select name="gitSecretId" aria-label="Jeton git"><option value="">(pas de jeton git)</option>${gitSecrets.map((s) => `<option value="${esc(s.id)}">${esc(s.label)} ${esc(s.hint)}</option>`).join("")}</select>
      <button class="primary">Ajouter le projet</button></div></form>
    <div class="err" data-err="project"></div></div>

  <div class="card"><h2>Secrets</h2>
    <div class="st">Chiffrés au repos. Une fois enregistrée, la valeur n'est plus jamais affichée.</div>
    ${d.secrets.length ? `<table style="margin-top:8px">${d.secrets.map((s) => `<tr><td>${esc(s.label)}</td>
      <td class="st">${s.kind === "git_token" ? "jeton git" : "clé " + esc(s.provider)}</td><td><code>${esc(s.hint)}</code></td>
      <td class="act"><button data-act="rm-secret" data-id="${esc(s.id)}">Supprimer</button></td></tr>`).join("")}</table>` : '<p class="st">Aucun secret.</p>'}
    <form data-form="secret"><div class="grid" style="margin-top:8px">
      <select name="kind" aria-label="Type"><option value="git_token">jeton git</option><option value="provider_key">clé de modèle</option></select>
      <select name="provider" aria-label="Fournisseur" hidden>${PROVIDERS.map((p) => `<option>${p}</option>`).join("")}</select>
      <input name="label" placeholder="libellé" maxlength="80" required>
      <input name="value" type="password" placeholder="valeur" autocomplete="off" required>
      <button class="primary">Enregistrer</button></div></form>
    <div class="err" data-err="secret"></div></div>

  <div class="card"><h2>Budget mensuel des modèles</h2>
    <div>Dépensé ce mois-ci : <strong>${esc(d.org.monthSpendUsd.toFixed(2))} $</strong> ·
      plafond : <strong>${d.org.budgetUsdMonth == null ? "illimité" : esc(d.org.budgetUsdMonth) + " $"}</strong></div>
    <form data-form="budget"><div class="row"><input name="budget" type="number" min="0" step="0.01" placeholder="plafond en $" style="max-width:180px">
      <button class="primary">Fixer</button><button type="button" data-act="budget-none">Illimité</button></div></form>
    <div class="err" data-err="budget"></div></div>`;

  const kind = S.querySelector('[name="kind"]'), prov = S.querySelector('[name="provider"]');
  kind.onchange = () => { prov.hidden = kind.value !== "provider_key"; };
  S.dataset.ready = "1";
}

const errAt = (name, e) => { const el = S.querySelector(`[data-err="${name}"]`); if (el) el.textContent = e ? e.message : ""; };

// Suppression en deux clics (pas de boîte de dialogue) : le 1er arme le bouton, le 2e confirme.
function confirmed(btn) {
  if (btn.classList.contains("armed")) return true;
  const label = btn.textContent; btn.classList.add("armed"); btn.textContent = "Confirmer ?";
  setTimeout(() => { btn.classList.remove("armed"); btn.textContent = label; }, 3000);
  return false;
}

S.addEventListener("change", async (ev) => {
  const sel = ev.target.closest('select[data-act="role"]'); if (!sel) return;
  try { await send(orgUrl(`/members/${sel.dataset.user}`), { role: sel.value }, "PATCH"); errAt("members"); }
  catch (e) { errAt("members", e); }
  await loadSettings();
});

S.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button[data-act]"); if (!b) return;
  const act = b.dataset.act;
  try {
    if (act === "rm-member") { if (!confirmed(b)) return; await send(orgUrl(`/members/${b.dataset.user}`), undefined, "DELETE"); if (b.dataset.user === ME.user.id) return boot(); }
    else if (act === "rm-invite") { await send(orgUrl(`/invitations/${b.dataset.id}`), undefined, "DELETE"); }
    else if (act === "rm-project") { if (!confirmed(b)) return; await send(orgUrl(`/projects/${b.dataset.id}`), undefined, "DELETE"); }
    else if (act === "rm-secret") { if (!confirmed(b)) return; await send(orgUrl(`/secrets/${b.dataset.id}`), undefined, "DELETE"); }
    else if (act === "budget-none") { await send(orgUrl(""), { budgetUsdMonth: null }, "PATCH"); }
    else return;
    await loadSettings();
  } catch (e) {
    const where = { "rm-member": "members", "rm-invite": "invite", "rm-project": "project", "rm-secret": "secret", "budget-none": "budget" }[act];
    errAt(where, e);
  }
});

S.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = ev.target, name = f.dataset.form, v = Object.fromEntries(new FormData(f));
  errAt(name);
  try {
    if (name === "invite") {
      const r = await send(orgUrl("/invitations"), { email: v.email, role: v.role });
      const link = `${location.origin}/?invite=${r.token}`;
      await loadSettings(); // recharge la liste, puis affiche le lien (montré cette seule fois)
      S.querySelector('[data-result="invite"]').innerHTML = `<p class="ok">Lien pour ${esc(r.email)} (7 jours, usage unique) — copie-le maintenant :</p>
        <div class="row"><input readonly value="${esc(link)}" id="invlink" aria-label="Lien d'invitation"><button type="button" id="copylink">Copier</button></div>`;
      S.querySelector("#copylink").onclick = () => { const i = S.querySelector("#invlink"); i.select(); navigator.clipboard?.writeText(i.value).catch(() => {}); };
      return;
    }
    if (name === "project") {
      await send(orgUrl("/projects"), {
        slug: v.slug, name: v.name, repo: v.repo,
        ...(v.branch ? { branch: v.branch } : {}), ...(v.check ? { check: v.check } : {}),
        protectedPaths: v.protectedPaths.split(",").map((s) => s.trim()).filter(Boolean),
        gitSecretId: v.gitSecretId || null,
      });
    }
    if (name === "secret") await send(orgUrl("/secrets"), { kind: v.kind, ...(v.kind === "provider_key" ? { provider: v.provider } : {}), label: v.label, value: v.value });
    if (name === "budget") await send(orgUrl(""), { budgetUsdMonth: v.budget === "" ? null : Number(v.budget) }, "PATCH");
    await loadSettings();
  } catch (e) { errAt(name, e); }
});

boot();
</script>
</html>
