<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Atelier</p>
    <h1>The orchestrator holds every secret; the AI runs in a sandbox that holds none</h1>

    <svg viewBox="0 0 1088 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">Atelier architecture</title>
      <desc id="architecture-desc">Architecture diagram showing a trusted orchestrator, vault and model proxy on a Docker host, an untrusted secret-free sandbox that reaches the model providers only through the proxy, and the git forge where a reviewer merges the proposal.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Trust boundary: Docker host -->
      <rect x="240" y="48" width="600" height="512" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="256" y="52" width="160" height="16" rx="2" fill="#f5f5f5"/>
      <text x="264" y="64" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">YOUR DOCKER HOST</text>

      <!-- Connectors (drawn before boxes) -->
      <!-- Teammate -> Orchestrator -->
      <line x1="208" y1="304" x2="264" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="216" y="280" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="236" y="292" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">CHAT</text>

      <!-- Orchestrator -> Vault -->
      <line x1="372" y1="256" x2="372" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="380" y="216" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="388" y="228" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">DECRYPT AT USE</text>

      <!-- Orchestrator -> Sandbox (focal) -->
      <line x1="480" y1="304" x2="600" y2="304" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="496" y="280" width="88" height="16" rx="2" fill="#f5f5f5"/>
      <text x="540" y="292" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">DOCKER RUN</text>

      <!-- Sandbox -> Proxy (only way out) -->
      <line x1="708" y1="352" x2="708" y2="432" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="716" y="384" width="96" height="16" rx="2" fill="#f5f5f5"/>
      <text x="724" y="396" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">ONLY WAY OUT</text>

      <!-- Proxy -> Model providers -->
      <line x1="816" y1="480" x2="888" y2="480" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Orchestrator -> Git forge -->
      <path d="M372,352 V472 Q372,480 364,480 H208" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="380" y="392" width="96" height="16" rx="2" fill="#f5f5f5"/>
      <text x="388" y="404" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">CLONE · PUSH</text>
      <rect x="380" y="416" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="388" y="428" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">TOKEN INJECTED</text>

      <!-- Git forge -> Reviewer -->
      <line x1="116" y1="528" x2="116" y2="608" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="124" y="560" width="60" height="16" rx="2" fill="#f5f5f5"/>
      <text x="132" y="572" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">MR / PR</text>

      <!-- Nodes -->
      <!-- Teammate -->
      <rect x="24" y="256" width="184" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="24" y="256" width="184" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="116" y="296" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Teammate</text>
      <text x="116" y="316" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">asks in plain language</text>

      <!-- Vault -->
      <rect x="264" y="96" width="216" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="264" y="96" width="216" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="372" y="132" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vault</text>
      <text x="372" y="152" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">AES-256-GCM</text>
      <text x="372" y="170" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">tokens · API keys</text>

      <!-- Orchestrator -->
      <rect x="264" y="256" width="216" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="264" y="256" width="216" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="372" y="292" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Orchestrator</text>
      <text x="372" y="312" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">API · stream · queue</text>
      <text x="372" y="330" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">accounts · orgs · roles</text>

      <!-- Sandbox (focal) -->
      <rect x="600" y="256" width="216" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="256" width="216" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="708" y="284" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sandbox</text>
      <text x="708" y="304" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">untrusted · disposable</text>
      <text x="708" y="320" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">one per task</text>
      <text x="708" y="336" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">no secret · no Internet</text>

      <!-- Model proxy -->
      <rect x="600" y="432" width="216" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="432" width="216" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="708" y="468" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Model proxy</text>
      <text x="708" y="488" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">adds the real key</text>
      <text x="708" y="506" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">generation routes only</text>

      <!-- Git forge -->
      <rect x="24" y="432" width="184" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="24" y="432" width="184" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="116" y="468" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Git forge</text>
      <text x="116" y="488" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">GitLab · self-hosted</text>
      <text x="116" y="506" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">GitHub</text>

      <!-- Model providers -->
      <rect x="888" y="432" width="176" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="888" y="432" width="176" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="976" y="468" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Model providers</text>
      <text x="976" y="488" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">Anthropic · OpenAI</text>
      <text x="976" y="506" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">OpenRouter</text>

      <!-- Reviewer -->
      <rect x="24" y="608" width="184" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="24" y="608" width="184" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="116" y="648" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reviewer</text>
      <text x="116" y="668" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">reads · tests · merges</text>

      <!-- Legend -->
      <line x1="24" y1="728" x2="1064" y2="728" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="24" y="756" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="136" y="744" width="20" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
      <text x="164" y="755" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">UNTRUSTED</text>
      <rect x="276" y="744" width="20" height="12" rx="2" fill="#ffffff" stroke="#2d3142"/>
      <text x="304" y="755" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">TRUSTED</text>
      <rect x="400" y="744" width="20" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
      <text x="428" y="755" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">STORE</text>
      <rect x="512" y="744" width="20" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
      <text x="540" y="755" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">EXTERNAL</text>
      <rect x="640" y="744" width="20" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/>
      <text x="668" y="755" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">PERSON</text>
      <line x1="772" y1="750" x2="800" y2="750" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="812" y="755" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">HTTPS</text>
      <line x1="896" y1="750" x2="924" y2="750" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="936" y="755" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">EGRESS</text>
    </svg>
  </div>
</body>
</html>
