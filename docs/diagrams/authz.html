<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorization flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Atelier</p>
    <h1>Authorization flow</h1>

      <line x1="744" y1="160" x2="744" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="416" y="188" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="420" y="197" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NO</text>

      <rect x="512" y="232" width="128" height="48" rx="6" fill="#f5f5f5"/><rect x="512" y="232" width="128" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="576" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">403</text><text x="576" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">insufficient rights</text>

      <rect x="680" y="232" width="128" height="48" rx="6" fill="#f5f5f5"/><rect x="680" y="232" width="128" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="744" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">404</text><text x="744" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">not found</text>

      <line x1="32" y1="316" x2="968" y2="316" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="336" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="112" y="326" width="24" height="12" rx="6" fill="rgba(122,131,153,0.10)" stroke="#7a8399"/><text x="144" y="336" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">START</text><polygon points="208,332 220,324 232,332 220,340" fill="#fff" stroke="#2d3142"/><text x="240" y="336" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CHECK</text><rect x="296" y="326" width="24" height="12" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/><text x="328" y="336" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">REJECTED</text><rect x="408" y="326" width="24" height="12" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/><text x="440" y="336" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ALLOWED</text>
