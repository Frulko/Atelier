<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vault-title vault-desc">
      <title id="vault-title">How a secret is stored and used</title>
      <desc id="vault-desc">Sequence showing an admin storing an encrypted secret that is never returned, then the orchestrator decrypting it in memory to clone and push, without the sandbox ever receiving it.</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <g stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3">
        <line x1="140" y1="68" x2="140" y2="560"/>
        <line x1="400" y1="68" x2="400" y2="560"/>
        <line x1="640" y1="68" x2="640" y2="560"/>
        <line x1="860" y1="68" x2="860" y2="560"/>
      </g>

      <!-- Phase dividers -->
      <line x1="40" y1="96" x2="960" y2="96" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="40" y="88" width="152" height="16" rx="2" fill="#f5f5f5"/>
      <text x="48" y="99" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STORING A SECRET</text>
      <line x1="40" y1="356" x2="960" y2="356" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="40" y="348" width="224" height="16" rx="2" fill="#f5f5f5"/>
      <text x="48" y="359" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">USING IT, WHEN A TASK RUNS</text>

      <!-- Activation bars -->
      <rect x="396" y="132" width="8" height="176" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="396" y="392" width="8" height="140" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages: phase 1 -->
      <line x1="144" y1="140" x2="396" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="220" y="120" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="270" y="129" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /SECRETS</text>

      <path d="M404,172 H428 Q436,172 436,180 V196 Q436,204 428,204 H408" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="448" y="184" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">AES-256-GCM(master key, random nonce,</text>
      <text x="448" y="196" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">authenticated data = org:secret)</text>

      <line x1="404" y1="248" x2="636" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="472" y="228" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="532" y="237" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CIPHERTEXT + HINT</text>
      <text x="532" y="268" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">nonce · tag · 4-char hint</text>

      <line x1="396" y1="296" x2="144" y2="296" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <rect x="216" y="276" width="108" height="12" rx="2" fill="#f5f5f5"/>
      <text x="270" y="285" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LABEL + HINT ONLY</text>
      <text x="270" y="320" fill="#eb6c36" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">the value never comes back</text>

      <!-- Messages: phase 2 -->
      <line x1="404" y1="404" x2="636" y2="404" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="472" y="384" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="532" y="393" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ BY ID + ORG</text>

      <path d="M404,436 H428 Q436,436 436,444 V460 Q436,468 428,468 H408" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="448" y="456" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">decrypt in memory</text>

      <line x1="404" y1="524" x2="856" y2="524" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="472" y="504" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="532" y="513" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLONE / PUSH</text>
      <text x="532" y="544" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">token via environment, never on disk</text>

      <!-- Actors -->
      <rect x="60" y="24" width="160" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="24" width="160" height="44" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="140" y="44" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Admin</text>
      <text x="140" y="60" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">browser</text>

      <rect x="320" y="24" width="160" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="24" width="160" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="44" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Orchestrator</text>
      <text x="400" y="60" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">API + pipeline · trusted</text>

      <rect x="560" y="24" width="160" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="24" width="160" height="44" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="640" y="44" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Database</text>
      <text x="640" y="60" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ciphertext only</text>

      <rect x="780" y="24" width="160" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="780" y="24" width="160" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="860" y="44" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Git forge</text>
      <text x="860" y="60" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">GitLab · GitHub</text>

      <!-- Boundary note (focal) -->
      <rect x="404" y="572" width="456" height="40" rx="6" fill="#f5f5f5"/>
      <rect x="404" y="572" width="456" height="40" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="632" y="596" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">The sandbox never receives the token</text>

      <!-- Legend -->
      <line x1="40" y1="640" x2="960" y2="640" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="120" y1="660" x2="152" y2="660" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="164" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">call</text>
      <line x1="220" y1="660" x2="252" y2="660" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="264" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">reply</text>
      <line x1="320" y1="660" x2="352" y2="660" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="364" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">external call</text>
      <rect x="480" y="654" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="504" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">security guarantee</text>
    </svg>