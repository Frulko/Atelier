include:
  - project: myrole/ci-templates
    ref: 9a47c54da0256171eaa59dca8afc9d94dd99a679
    file: /buildkit.yml
  - project: myrole/ci-templates
    ref: 9a47c54da0256171eaa59dca8afc9d94dd99a679
    file: /deploy.yml

stages: [check, integration, build, deploy]

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_TAG'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

variables:
  PLATFORMS: linux/amd64
  ORCHESTRATOR_IMAGE: $CI_REGISTRY_IMAGE/atelier
  SANDBOX_IMAGE: $CI_REGISTRY_IMAGE/atelier-sandbox
  ATELIER_RELEASE: commit-$CI_COMMIT_SHA

default:
  interruptible: true
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure]

checks:
  stage: check
  image: node:24-bookworm
  script:
    - npm --prefix orchestrator ci --no-audit --no-fund
    - npm --prefix orchestrator run check
    - npm --prefix orchestrator test
    - npm --prefix web ci --no-audit --no-fund
    - npm --prefix web run check
    - npm --prefix web test
    - npm --prefix web run build
    - node --test scripts/deploy-portainer.test.mjs
    - node --test scripts/ci-build.test.mjs

.docker-host:
  tags: [atelier-docker]
  resource_group: atelier-docker
  timeout: 45m
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

integration:
  extends: .docker-host
  stage: integration
  interruptible: false
  script:
    - export PATH="/opt/atelier-ci/bin:$PATH"
    - node -e 'if (Number(process.versions.node.split(".")[0]) < 24) process.exit(1)'
    - python3 -c 'import playwright'
    - docker compose version
    - ./scripts/smoke.sh
    - ./scripts/prod-test.sh
  after_script:
    # Les faux dépôts reçoivent des écritures root : rendre le dossier au runner.
    - >-
      if [ -d "$CI_PROJECT_DIR/.smoke" ] && docker image inspect atelier-sandbox:latest >/dev/null 2>&1; then
        docker run --rm --network none --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE
        --security-opt no-new-privileges --user 0 --entrypoint chown
        -v "$CI_PROJECT_DIR/.smoke:/cleanup" atelier-sandbox:latest
        -R "$(id -u):$(id -g)" /cleanup;
      fi

.atelier-build:
  extends: .default-build
  needs: [integration]
  timeout: 45m
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - sh .gitlab/ci/build.sh

build-orchestrator:
  extends: .atelier-build
  variables:
    IMAGE: $ORCHESTRATOR_IMAGE
    BUILD_CONTEXT: .
    DOCKERFILE_DIR: orchestrator

build-sandbox:
  extends: .atelier-build
  variables:
    IMAGE: $SANDBOX_IMAGE
    BUILD_CONTEXT: sandbox
    DOCKERFILE_DIR: sandbox

.atelier-deploy:
  extends: .default-deploy
  image: node:24-bookworm
  needs: [build-orchestrator, build-sandbox]
  script:
    - node scripts/deploy-portainer.mjs

deploy:
  extends: .atelier-deploy
  variables:
    DEPLOY_WEBHOOK_URL: $PORTAINER_WEBHOOK_URL
    DEPLOY_WEBHOOK_SECRET: $PORTAINER_WEBHOOK_SECRET
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PORTAINER_WEBHOOK_URL'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $PORTAINER_WEBHOOK_URL'

deploy-staging:
  extends: .atelier-deploy
  variables:
    DEPLOY_ENVIRONMENT: staging
    DEPLOY_WEBHOOK_URL: $PORTAINER_STAGING_WEBHOOK_URL
    DEPLOY_WEBHOOK_SECRET: $PORTAINER_STAGING_WEBHOOK_SECRET
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "staging" && $PORTAINER_STAGING_WEBHOOK_URL'
